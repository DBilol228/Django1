<!DOCTYPE html>
<html>
<head>
    <title>Update Category</title>
</head>
<body>
    <h1 style="color: red;">Update Category</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" value="{{ category.name }}">
        <br><br>
        <textarea name="description">{{ category.description }}</textarea>
        <br><br>
        <button type="submit">
            Update
        </button>
    </form>
    <br>
    <a href="{% url 'categories' %}">Back</a>
</body>
</html>
